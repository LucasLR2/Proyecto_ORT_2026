<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Postulante</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <h1>Registro de Postulante</h1>
  <form onsubmit="handleSubmit(event)">
    <fieldset>
      <legend>Datos del postulante</legend>
      <div class="campo">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" />
      </div>
      <div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" />
      </div>
      <div class="campo">
        <label for="fullname">Nombre completo:</label>
        <input type="text" id="fullname" name="fullname" />
      </div>
      <div class="campo">
        <label for="level">Nivel de experiencia:</label>
        <select id="level" name="level">
          <option value="">Seleccione una opción</option>
          <option value="junior">Junior</option>
          <option value="semi-senior">Semi-Senior</option>
          <option value="senior">Senior</option>
        </select>
      </div>
      <div class="campo">
        <label for="area">Área de interés:</label>
        <select id="area" name="area">
          <option value="">Seleccione una opción</option>
          <option value="tecnologia">Tecnología</option>
          <option value="diseno">Diseño</option>
          <option value="marketing">Marketing</option>
          <option value="administracion">Administración</option>
        </select>
      </div>
    </fieldset>
    <div class="botones">
      <button type="submit">Registrarse</button>
      <button type="reset" class="secondary">Cancelar</button>
    </div>
  </form>
  <div class="actions">
    <a href="login_postulante.html">Ya tengo cuenta</a>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
