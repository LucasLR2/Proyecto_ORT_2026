<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Ofertas Laborales</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <h1>Gestión de Ofertas Laborales</h1>
  <div class="top-bar">
    <button type="button" onclick="crearOferta()">+ Crear nueva oferta</button>
    <a href="../index.html">Volver al menú principal</a>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>JOB_OFFER_1</td>
        <td>Dev Frontend</td>
        <td>Activa</td>
        <td class="actions">
          <button class="edit" type="button" onclick="editar('JOB_OFFER_1')">Ed</button>
          <button class="close" type="button" onclick="cerrar('JOB_OFFER_1')">Cer</button>
        </td>
      </tr>
      <tr>
        <td>JOB_OFFER_2</td>
        <td>Analista Dat</td>
        <td>Inact.</td>
        <td class="actions">
          <button class="edit" type="button" onclick="editar('JOB_OFFER_2')">Ed</button>
          <button class="close" type="button" onclick="cerrar('JOB_OFFER_2')">Cer</button>
        </td>
      </tr>
      <tr>
        <td>JOB_OFFER_3</td>
        <td>Diseñador UX</td>
        <td>Cerrada</td>
        <td>-</td>
      </tr>
    </tbody>
  </table>
  <small>Al editar: mismo formulario prellenado con datos actuales de la oferta.</small>
  <script src="../js/ofertas.js"></script>
</body>
</html>
